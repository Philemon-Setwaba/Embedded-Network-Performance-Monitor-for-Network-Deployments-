# infrastructure/grafana/provisioning/datasource.yaml
#
# Tells Grafana where to find VictoriaMetrics.
# Grafana reads this file every time it starts, so the data source
# never has to be added by hand.
#
# install.sh copies it to:
#   /etc/grafana/provisioning/datasources/victoriametrics.yaml

# Version of the provisioning file format (always 1).
apiVersion: 1

datasources:
  - # The name shown in Grafana's menus.
    name: VictoriaMetrics

    # A fixed ID. Every dashboard panel refers to the data source by this
    # ID, so the exported dashboard JSON works on ANY Grafana that has this
    # same file (the Pi now, the laptop later).
    uid: victoriametrics

    # VictoriaMetrics answers queries the same way Prometheus does,
    # so we use Grafana's built-in Prometheus data source type.
    type: prometheus

    # "proxy" = the Grafana server (on the Pi) fetches the data,
    # not your web browser.
    access: proxy

    # Where VictoriaMetrics listens (same port as in victoria.service).
    url: http://localhost:8428

    # Use this data source automatically for new panels.
    isDefault: true

    # Settings can only be changed in this file, not in the Grafana UI,
    # so the file in git always stays the "master copy".
    editable: false

    jsonData:
      # How often our data arrives (ping every 30 s).
      # Grafana uses this so graphs don't try to show gaps smaller than that.
      timeInterval: 30s